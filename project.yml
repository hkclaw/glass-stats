# XcodeGen spec. A checked-in GlassStats.xcodeproj already opens in Xcode 16+.
# Optional regenerate: brew install xcodegen && xcodegen generate
name: GlassStats
options:
  bundleIdPrefix: com.hkclaw
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ARCHS: arm64
    EXCLUDED_ARCHS: x86_64
    SUPPORTED_PLATFORMS: macosx
    SDKROOT: macosx
    ENABLE_APP_SANDBOX: NO
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  GlassStats:
    type: application
    platform: macOS
    sources:
      - path: GlassStats
        excludes:
          - "**/*.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hkclaw.GlassStats
        PRODUCT_NAME: "Glass Stats"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Glass Stats"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 hkclaw. MIT License. Not affiliated with Stats / exelban."
        CODE_SIGN_ENTITLEMENTS: GlassStats/GlassStats.entitlements
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        SWIFT_EMIT_LOC_STRINGS: YES
        SWIFT_OBJC_BRIDGING_HEADER: GlassStats/GlassStats-Bridging-Header.h
    info:
      properties:
        LSUIElement: true
        CFBundleDisplayName: Glass Stats
        LSApplicationCategoryType: public.app-category.utilities
    entitlements:
      path: GlassStats/GlassStats.entitlements
      properties:
        com.apple.security.app-sandbox: false
    scheme:
      testTargets: []
