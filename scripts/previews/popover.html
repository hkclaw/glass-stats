<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Glass Stats popover preview</title>
  <link rel="stylesheet" href="preview.css" />
</head>
<body>
  <div class="wallpaper-window w1">
    <div class="fake-doc">
      <strong>Notes</strong>
      <span></span><span></span><span class="short"></span>
    </div>
  </div>
  <div class="wallpaper-window w2"></div>
  <header class="menubar">
    <span class="menu-app">Finder</span>
    <span class="dim">File</span>
    <span class="dim">Edit</span>
    <span class="dim">View</span>
    <span class="spacer"></span>
    <span class="status">18% <span class="dot">·</span> 46%</span>
    <span>Wi-Fi</span>
    <span>Fri 9 Oct 16:42</span>
  </header>
  <section class="popover" aria-label="Glass Stats popover">
    <div class="header">
      <div>
        <h1>Glass Stats</h1>
        <p>Local only · Apple Silicon</p>
      </div>
      <div class="actions">
        <div class="icon-btn" aria-hidden="true">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </div>
        <div class="icon-btn" aria-hidden="true">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v10"/><path d="M6.3 6.3a8 8 0 1 0 11.4 0"/></svg>
        </div>
      </div>
    </div>

    <article class="card">
      <div class="row">
        <span class="title">CPU</span>
        <span class="big cyan">18%</span>
      </div>
      <svg class="chart" viewBox="0 0 340 64" preserveAspectRatio="none">
        <defs>
          <linearGradient id="cpuFill" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.38"/>
            <stop offset="100%" stop-color="#67e8f9" stop-opacity="0.02"/>
          </linearGradient>
        </defs>
        <path d="M0 46 C 30 44, 50 28, 80 32 S 130 50, 170 36 S 230 14, 270 22 S 320 40, 340 30 V64 H0 Z" fill="url(#cpuFill)"/>
        <path d="M0 46 C 30 44, 50 28, 80 32 S 130 50, 170 36 S 230 14, 270 22 S 320 40, 340 30" fill="none" stroke="#67e8f9" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <div class="cores">
        <span style="height:8px;opacity:.45"></span>
        <span style="height:14px;opacity:.7"></span>
        <span style="height:6px;opacity:.4"></span>
        <span style="height:18px"></span>
        <span style="height:11px;opacity:.6"></span>
        <span style="height:9px;opacity:.5"></span>
        <span style="height:16px;opacity:.85"></span>
        <span style="height:7px;opacity:.42"></span>
        <span style="height:12px;opacity:.65"></span>
        <span style="height:5px;opacity:.35"></span>
      </div>
    </article>

    <article class="card">
      <div class="row">
        <span class="title">Memory</span>
        <span class="big mint">46%</span>
      </div>
      <svg class="chart" viewBox="0 0 340 64" preserveAspectRatio="none">
        <defs>
          <linearGradient id="memFill" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#5eead4" stop-opacity="0.35"/>
            <stop offset="100%" stop-color="#5eead4" stop-opacity="0.02"/>
          </linearGradient>
        </defs>
        <path d="M0 30 C 40 29, 80 27, 120 28 S 200 32, 260 26 S 310 24, 340 25 V64 H0 Z" fill="url(#memFill)"/>
        <path d="M0 30 C 40 29, 80 27, 120 28 S 200 32, 260 26 S 310 24, 340 25" fill="none" stroke="#5eead4" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <p class="meta">22.1 GB used of 48 GB</p>
      <div class="metrics">
        <div><small>App</small><b>14.2 GB</b></div>
        <div><small>Wired</small><b>4.8 GB</b></div>
        <div><small>Compressed</small><b>3.1 GB</b></div>
      </div>
    </article>

    <article class="card">
      <div class="title">Top processes</div>
      <div class="process"><span class="name">Xcode</span><span class="num">126%</span><span class="mem">2.4 GB</span></div>
      <div class="process"><span class="name">Google Chrome</span><span class="num">42%</span><span class="mem">1.1 GB</span></div>
      <div class="process"><span class="name">WindowServer</span><span class="num">18%</span><span class="mem">486 MB</span></div>
      <div class="process"><span class="name">Glass Stats</span><span class="num">3%</span><span class="mem">82 MB</span></div>
    </article>
  </section>
</body>
</html>
